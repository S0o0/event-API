<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baptême</title>
    <link rel="stylesheet" href="./css/style_bapteme.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Bouton admin -->
    <div id="admin-access">
        <button id="btn-admin">
            <img src="./img/lock-icon.png" alt="Admin" />
        </button>
    </div>

    <div class="container">
        <div class="item">
            <a class="popup-link" id="accueil-link" href="#" data-module="accueil">
                <div class="icon">
                    <img src="./img/video-home.png" alt="Accueil">
                    <!-- <h3>ACCUEIL</h3> -->
                </div>
            </a>
        </div>
        <div class="item">
            <a class="popup-link" href="https://www.zoom.com/fr" data-module="facetime" id="option">
                <div class="icon">
                    <img src="./img/facetime.png" alt="video-chat">
                    <!-- <h3>APPEL VIDÉO</h3> -->
                </div>
            </a>
        </div>

        <div class="item">
            <a class="popup-link" href="https://vocalvideo.com/" data-module="livreor" id="option">
                <div class="icon">
                    <img src="./img/livreor.png" alt="Livre d'or">
                    <!-- <h3>LIVRE D'OR VIDÉO</h3> -->
                </div>
            </a>
        </div>

        <div class="item">
            <a href="#" id="option" data-module="livreoraudio" class="icon popup-link">
                <img src="./img/livreoraudio.png" alt="Livre d'or audio">
                <!-- <h3>LIVRE D'OR AUDIO</h3> -->
            </a>
        </div>

        <div class="item">
            <a class="popup-link" href="https://www.simplebooth.com/" data-module="photo" id="option">
                <div class="icon">
                    <img src="./img/photobooth-ia.jpg" alt="Photobooth">
                    <!-- <h3>PHOTOBOOTH</h3> -->
                </div>
            </a>
        </div>

        <div class="item">
            <a class="popup-link" href="https://www.loom.com/" data-module="video" id="option">
                <div class="icon">
                    <img src="./img/videobooth-ia.jpg" alt="Videobooth">
                    <!-- <h3>VIDEOBOOTH</h3> -->
                </div>
            </a>
        </div>

        <div class="item">
            <a class="popup-link" href="https://www.loom.com/" data-module="karaoke" id="option">
                <div class="icon">
                    <img src="./img/karaoke-ia(1).png" alt="Karaoke">
                    <!-- <h3>VIDEOBOOTH</h3> -->
                </div>
            </a>
        </div>
    </div>

    <script src="./js/scriptGrey.js"></script>
    <script src="./js/scriptBackButton.js"></script>
    <script src="./js/scriptPopup.js"></script>
    <script src="./js/scriptURLBack.js"></script>
</body>

</html>
