<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Séminaire</title>
    <link rel="stylesheet" href="./css/style_seminaire.css" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet" />
</head>

<body>

    <!-- Bouton admin -->
    <div id="admin-access">
        <button id="btn-admin">
            <img src="./img/lock-icon.png" alt="Admin" />
        </button>
    </div>

    <div class="container">
        <div class="item">
            <a class="popup-link" href="#" data-module="accueil" id="accueil-link">
                <div class="icon">
                    <img src="./img/video-home.png" alt="Accueil" />
                    <!-- <h3>ACCUEIL</h3> -->
                </div>
            </a>
        </div>
        <div class="item">
            <a class="popup-link" href="https://www.slido.com/fr" data-module="feedback" id="option">
                <div class="icon">
                    <img src="./img/feedback.png" alt="Feedback" />
                    <!-- <h3>FEEDBACK</h3> -->
                </div>
            </a>
        </div>
        <div class="item">
            <a class="popup-link" href="https://www.karafun.fr/" data-module="karaoke" id="option">
                <div class="icon">
                    <img src="./img/karaoke-ia(1).png" alt="karaoke" />
                    <!-- <h3>KARAOKE</h3> -->
                </div>
            </a>
        </div>
        <div class="item">
            <a class="popup-link" href="https://www.simplebooth.com/" data-module="photo" id="option">
                <div class="icon">
                    <img src="./img/photobooth-ia.jpg" alt="photo" />
                    <!-- <h3>PHOTOBOOTH</h3> -->
                </div>
            </a>
        </div>
        <div class="item">
            <a class="popup-link" href="https://www.loom.com/" data-module="video" id="option">
                <div class="icon">
                    <img src="./img/videobooth-ia.jpg" alt="video" />
                    <!-- <h3>VIDEOBOOTH</h3> -->
                </div>
            </a>
        </div>
        <div class="item">
            <a class="popup-link" href="https://solis.pro/?page_id=524" data-module="tombola" id="option">
                <div class="icon">
                    <img src="./img/tombola.png" alt="tombola" />
                    <!-- <h3>JEU INTERACTIF</h3> -->
                </div>
            </a>
        </div>
    </div>

    <script src="./js/scriptGrey.js"></script>
    <script src="./js/scriptBackButton.js"></script>
    <script src="./js/scriptURLBack.js"></script>
    <script src="./js/scriptPopup.js"></script>
</body>

</html>
