<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mariage</title>
    <link rel="stylesheet" href="./css/style_wedding.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Bouton admin -->
    <div id="admin-access">
        <button id="btn-admin">
            <img src="./img/lock-icon.png" alt="Admin" />
        </button>
    </div>

    <div class="container">
        <!-- Ligne du haut -->
        <div class="item">
            <a class="icon popup-link" href="#" data-module="accueil" id="accueil-link">
                <img src="img/video-home.png" alt="Accueil">
            </a>
        </div>

        <div class="item">
            <a href="https://vocalvideo.com/" id="option" data-module="livreor" class="icon popup-link">
                <img src="./img/livreor.png" alt="Livre d'or">
                <!-- <h3>LIVRE D'OR VIDÉO</h3> -->
            </a>
        </div>

        <div class="item">
            <a href="#" id="option" data-module="livreoraudio" class="icon popup-link">
                <img src="./img/livreoraudio.png" alt="Livre d'or audio">
                <!-- <h3>LIVRE D'OR AUDIO</h3> -->
            </a>
        </div>

        <div class="item">
            <a href="#" id="option" data-module="programme" class="icon popup-link">
                <img src="./img/timetable.png" alt="Programme">
                <!-- <h3>PROGRAMME DU MARIAGE</h3> -->
            </a>
        </div>

        <div class="item">
            <a href="https://www.simplebooth.com/" id="option" data-module="photo" class="icon popup-link">
                <img src="./img/photobooth-ia.jpg" alt="Photobooth">
                <!-- <h3>PHOTOBOOTH</h3> -->
            </a>
        </div>

        <!-- Ligne du bas -->
        <div class="item">
            <a href="#" id="option" data-module="plan" class="icon popup-link">
                <img src="./img/dinner-table.png" alt="Plan">
                <!-- <h3>PLAN DE TABLE</h3> -->
            </a>
        </div>

        <div class="item">
            <a href="https://www.loom.com/" id="option" data-module="video" class="icon popup-link">
                <img src="./img/videobooth-ia.jpg" alt="Videobooth">
                <!-- <h3>VIDEOBOOTH</h3> -->
            </a>
        </div>

        <div class="item">
            <a href="https://www.karafun.fr/" id="option" data-module="karaoke" class="icon popup-link">
                <img src="./img/karaoke-ia.png" alt="Karaoke">
                <!-- <h3>KARAOKE</h3> -->
            </a>
        </div>

        <div class="item">
            <a href="https://www.zoom.com/fr" id="option" data-module="facetime" class="icon popup-link">
                <img src="./img/facetime.png" alt="facetime">
                <!-- <h3>APPEL VIDÉO</h3> -->
            </a>
        </div>
        <div class="item">
            <a href="#" id="option" data-module="quiz" class="icon popup-link">
                <img src="./img/quiz.png" alt="quiz">
                <!-- <h3>QUIZ SUR LES MARIÉS</h3> -->
            </a>
        </div>

        <div class="item">
            <a href="https://solis.pro/?page_id=524" id="option" data-module="tombola" class="icon popup-link">
                <img src="./img/tombola.png" alt="Tombola">
                <!-- <h3>JEU INTERACTIF</h3> -->
            </a>
        </div>

    </div>

    <script src="./js/scriptGrey.js"></script>
    <script src="./js/scriptBackButton.js"></script>
    <script src="./js/scriptPopup.js"></script>
    <script src="./js/scriptURLBack.js"></script>
</body>

</html>
